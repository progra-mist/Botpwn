name: Compile Pawn

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID запроса"
        required: true
        type: string
      source_dir:
        description: "Папка с исходниками"
        required: true
        type: string

jobs:
  compile:
    runs-on: ubuntu-22.04
    container:
      image: michaelace/pawncc:3.10.11-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile
        shell: bash
        run: |
          # Ищем главный .pwn файл
          MAIN_PWN=$(find "${{ inputs.source_dir }}" -name "*.pwn" | head -n 1)
          if [ -z "$MAIN_PWN" ]; then
            echo "::error::Файл .pwn не найден"
            exit 1
          fi

          # Ищем ВСЕ папки с инклюдами внутри папки пользователя
          # И добавляем корень репозитория (где лежат твои базовые инклюды)
          INC_FLAGS="-i."
          
          # Находим все файлы .inc и берем их папки
          INC_DIRS=$(find "${{ inputs.source_dir }}" -name "*.inc" -printf '%h\n' | sort -u)
          for dir in $INC_DIRS; do
            INC_FLAGS="$INC_FLAGS -i$dir"
          done

          echo "Компилируем: $MAIN_PWN"
          echo "Флаги инклюдов: $INC_FLAGS"

          pawncc "$MAIN_PWN" $INC_FLAGS -ooutput.amx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawn-${{ inputs.request_id }}
          path: output.amx
          if-no-files-found: error
          retention-days: 1

          
