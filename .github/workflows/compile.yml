name: Compile Pawn

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID запроса"
        required: true
        type: string
      source_dir:
        description: "Папка с исходниками"
        required: true
        type: string

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Pawn Compiler
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-windows.zip" -OutFile "pawnc.zip"
          Expand-Archive -Path "pawnc.zip" -DestinationPath "pawnc"
          
          $pawnccPath = Get-ChildItem -Path "pawnc" -Filter "pawncc.exe" -Recurse | Select-Object -First 1
          $pawncDll = Get-ChildItem -Path "pawnc" -Filter "pawnc.dll" -Recurse | Select-Object -First 1
          
          if (-not $pawncDll) {
            Write-Error "pawnc.dll не найдена в архиве!"
            exit 1
          }
          
          Copy-Item $pawncDll.FullName -Destination "pawnc.dll"
          
          echo "PAWNCC_PATH=$($pawnccPath.FullName)" >> $env:GITHUB_ENV
          Write-Host "Компилятор: $($pawnccPath.FullName)"
          Write-Host "DLL скопирована в корень: pawnc.dll"

      - name: Compile
        shell: cmd
        run: |
          set MAIN_PWN=
          for /f "delims=" %%i in ('dir /b /s "${{ inputs.source_dir }}\*.pwn" ^| findstr /v /i "\\include\\"') do (
            set MAIN_PWN=%%i
            goto :found
          )
          :found
          if "%MAIN_PWN%"=="" (
            echo Главный файл .pwn не найден
            exit /b 1
          )
          echo === КОМПИЛИРУЕМ: %MAIN_PWN% ===
          
          set INC_FLAGS=
          for /f "delims=" %%d in ('dir /b /s /ad "${{ inputs.source_dir }}"') do (
            set INC_FLAGS=%INC_FLAGS% -i"%%d"
          )
          
          echo === ЗАПУСК PAWNCC ===
          "%PAWNCC_PATH%" "%MAIN_PWN%" %INC_FLAGS% -ooutput.amx
          
          if not exist output.amx (
            echo Файл output.amx не создан. Ошибка компиляции.
            exit /b 1
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawn-${{ inputs.request_id }}
          path: output.amx
          if-no-files-found: error
          retention-days: 1
