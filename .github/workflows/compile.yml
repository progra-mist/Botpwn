name: Compile Pawn (Windows)
run-name: Compile Pawn [${{ inputs.request_id }}]

on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      source_dir:
        required: true
        type: string

jobs:
  compile-windows:
    runs-on: windows-2022
    permissions:
      contents: write # <--- ВАЖНО: даем права на создание релиза

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install VC++ Runtimes via Chocolatey
        shell: powershell
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          }
          choco install vcredist2010 vcredist2015 --no-progress -y --ignore-checksums --limit-output

      - name: Download Pawn Compiler
        shell: powershell
        run: |
          $url = "https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-windows.zip"
          Invoke-WebRequest -Uri $url -OutFile "pawnc.zip"
          Expand-Archive -Path "pawnc.zip" -DestinationPath "C:\pawnc" -Force
          Remove-Item "pawnc.zip"

      - name: Compile
        shell: cmd
        run: |
          cd /D "C:\pawnc\bin"
          set MAIN_PWN=
          for /f "delims=" %%i in ('dir /b /s "${{ inputs.source_dir }}\*.pwn" ^| findstr /v /i "\\include\\"') do (
            set MAIN_PWN=%%i
            goto :found
          )
          :found
          if "%MAIN_PWN%"=="" ( echo Главный .pwn не найден & exit /b 1 )
          set INC_DIR=
          for /f "delims=" %%d in ('dir /b /s /ad "${{ inputs.source_dir }}" ^| findstr /i "\\include$"') do (
            set INC_DIR=%%d
            goto :found_inc
          )
          :found_inc
          if "%INC_DIR%"=="" ( set INC_DIR=C:\pawnc\include )
          pawncc.exe "%MAIN_PWN%" "-o%GITHUB_WORKSPACE%\Crime" "-i%INC_DIR%" "-iC:\pawnc\include" -d3 -;+ -(
          if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%
          if not exist "%GITHUB_WORKSPACE%\Crime.amx" ( echo Файл Crime.amx не создан! & exit /b 1 )

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.request_id }}
          name: Build ${{ inputs.request_id }}
          files: Crime.amx
