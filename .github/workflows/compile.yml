name: Compile Pawn Gamemode (Windows)

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID запроса"
        required: true
        type: string
      source_dir:
        description: "Папка с исходниками"
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Install VC++ x86 Runtime
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x86.exe" -OutFile "vc_redist.x86.exe"
          Start-Process -FilePath ".\vc_redist.x86.exe" -ArgumentList "/install", "/quiet", "/norestart" -NoNewWindow -Wait
          Remove-Item ".\vc_redist.x86.exe"

      - name: 📦 Setup Pawn Compiler (3.10.10)
        shell: powershell
        run: |
          $compilerUrl = "https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-windows.zip"
          Invoke-WebRequest -Uri $compilerUrl -OutFile "pawnc.zip"
          Expand-Archive -Path "pawnc.zip" -DestinationPath "$env:RUNNER_TEMP\pawnc"
          Remove-Item "pawnc.zip"

      - name: 🔨 Compile Pawn Script
        shell: powershell
        run: |
          # Ищем главный .pwn в динамической папке
          $mainPwn = Get-ChildItem -Path "${{ inputs.source_dir }}" -Filter "*.pwn" -Recurse | Where-Object { $_.FullName -notmatch '\\include\\' } | Select-Object -First 1
          if (-not $mainPwn) { Write-Error "Главный .pwn не найден"; exit 1 }
          
          # Ищем папку include
          $incDir = Get-ChildItem -Path "${{ inputs.source_dir }}" -Directory -Recurse | Where-Object { $_.FullName -match '\\pawno\\include$' } | Select-Object -First 1
          if (-not $incDir) {
             $incDir = Get-ChildItem -Path "${{ inputs.source_dir }}" -Directory -Recurse | Where-Object { $_.Name -eq 'include' } | Select-Object -First 1
          }
          if (-not $incDir) { Write-Error "Папка include не найдена"; exit 1 }

          $pawnDir = "$env:RUNNER_TEMP\pawnc\bin"
          $sourceFile = $mainPwn.FullName
          $outputFile = "$env:GITHUB_WORKSPACE\output.amx"
          $incDir1 = $incDir.FullName
          $incDir2 = "$env:RUNNER_TEMP\pawnc\include"

          Write-Host "=== КОМПИЛИРУЕМ: $sourceFile ==="
          Write-Host "=== ИНКЛЮДЫ: $incDir1 ==="

          # Запуск строго внутри папки с pawncc.exe для корректной подгрузки pawnc.dll
          Push-Location $pawnDir
          
          # Запуск компилятора: -i добавляет пути поиска, -;+ включает строгий синтаксис
          & .\pawncc.exe "$sourceFile" "-o$outputFile" "-i$incDir1" "-i$incDir2" "-d3" "-;+" "-("
          
          $exitCode = $LASTEXITCODE
          Pop-Location

          if ($exitCode -ne 0) {
            Write-Error "Pawn compiler failed with exit code $exitCode"
            exit $exitCode
          }
          
          if (-not (Test-Path $outputFile)) {
            Write-Error "Файл output.amx не создан."
            exit 1
          }

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawn-${{ inputs.request_id }}
          path: output.amx
          if-no-files-found: error
          retention-days: 1
