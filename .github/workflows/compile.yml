name: Compile Pawn

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID запроса"
        required: true
        type: string
      source_dir:
        description: "Папка с исходниками"
        required: true
        type: string

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Pawn Compiler
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-windows.zip" -OutFile "pawnc.zip"
          Expand-Archive -Path "pawnc.zip" -DestinationPath "pawnc"
          $pawnccPath = Get-ChildItem -Path "pawnc" -Filter "pawncc.exe" -Recurse | Select-Object -First 1
          $pawnccDir = $pawnccPath.DirectoryName
          # Добавляем папку с компилятором в PATH
          echo "$pawnccDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # Сохраняем путь к компилятору в переменную окружения для следующего шага
          echo "PAWNCC_PATH=$($pawnccPath.FullName)" >> $env:GITHUB_ENV
          Write-Host "Компилятор найден в: $pawnccDir"

      - name: Compile
        shell: pwsh
        run: |
          $mainPwn = Get-ChildItem -Path "${{ inputs.source_dir }}" -Filter "*.pwn" -Recurse | Where-Object { $_.FullName -notmatch '\\include\\' } | Select-Object -First 1
          if (-not $mainPwn) {
            Write-Error "Главный файл .pwn не найден"
            exit 1
          }
          Write-Host "=== КОМПИЛИРУЕМ: $($mainPwn.FullName) ==="
          
          $allDirs = Get-ChildItem -Path "${{ inputs.source_dir }}" -Directory -Recurse | Select-Object -ExpandProperty FullName
          $incFlags = ""
          foreach ($dir in $allDirs) {
            $incFlags += " -i`"$dir`""
          }
          
          Write-Host "=== ЗАПУСК PAWNCC ==="
          
          # Запускаем компилятор, указывая полный путь и добавляя папку с DLL в PATH для этого процесса
          $pawnccDir = Split-Path $env:PAWNCC_PATH -Parent
          $env:PATH = "$pawnccDir;$env:PATH"
          
          # Запускаем и ловим вывод
          & "$env:PAWNCC_PATH" $mainPwn.FullName $incFlags -ooutput.amx 2>&1 | Tee-Object -Variable output
          
          # Проверяем, создался ли файл
          if (-not (Test-Path "output.amx")) {
            Write-Error "Файл output.amx не создан. Ошибка компиляции."
            Write-Host "Вывод компилятора:"
            Write-Host $output
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawn-${{ inputs.request_id }}
          path: output.amx
          if-no-files-found: error
          retention-days: 1
