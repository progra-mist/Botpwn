name: Compile Pawn

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID запроса"
        required: true
        type: string
      source_dir:
        description: "Папка с исходниками"
        required: true
        type: string

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Pawn Compiler
        shell: pwsh
        run: |
          New-Item -Path "tools" -ItemType Directory -Force
          Invoke-WebRequest -Uri "https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-windows.zip" -OutFile "pawnc.zip"
          Expand-Archive -Path "pawnc.zip" -DestinationPath "pawnc_temp"
          $pawnccPath = Get-ChildItem -Path "pawnc_temp" -Filter "pawncc.exe" -Recurse | Select-Object -First 1
          $pawncDll = Get-ChildItem -Path "pawnc_temp" -Filter "pawnc.dll" -Recurse | Select-Object -First 1
          Copy-Item $pawnccPath.FullName -Destination "tools\pawncc.exe"
          Copy-Item $pawncDll.FullName -Destination "tools\pawnc.dll"

      - name: Compile main.pwn
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $mainPwn = Get-ChildItem -Path "${{ inputs.source_dir }}" -Filter "*.pwn" -Recurse | Where-Object { $_.FullName -notmatch '\\include\\' } | Select-Object -First 1
          if (-not $mainPwn) { throw "Главный .pwn не найден" }
          
          $incDir = Get-ChildItem -Path "${{ inputs.source_dir }}" -Directory -Recurse | Where-Object { $_.FullName -match '\\pawno\\include$' } | Select-Object -First 1
          if (-not $incDir) {
             $incDir = Get-ChildItem -Path "${{ inputs.source_dir }}" -Directory -Recurse | Where-Object { $_.Name -eq 'include' } | Select-Object -First 1
          }
          if (-not $incDir) { throw "Папка include не найдена" }

          $pawncc = Join-Path $env:GITHUB_WORKSPACE 'tools\pawncc.exe'
          $toolsDir = Join-Path $env:GITHUB_WORKSPACE 'tools'
          $sourceDir = $mainPwn.DirectoryName
          $sourceName = $mainPwn.BaseName
          $include = $incDir.FullName
          $output = Join-Path $env:GITHUB_WORKSPACE 'output.amx'
          $bat = Join-Path $env:RUNNER_TEMP 'compile-pawn.bat'

          # Создаем .bat файл с указанием PATH к tools
          @"
          @echo off
          set PATH=$toolsDir;%PATH%
          cd /d "$sourceDir"
          "$pawncc" "$sourceName" -i"$include" -o"$output"
          exit /b %ERRORLEVEL%
          "@ | Set-Content -LiteralPath $bat -Encoding ASCII

          # Запускаем через cmd.exe
          & $env:ComSpec /d /c "`"$bat`""
          if ($LASTEXITCODE -ne 0) {
            throw "pawncc failed with exit code $LASTEXITCODE"
          }

          if (-not (Test-Path -LiteralPath $output)) {
            throw "Compilation returned success but output.amx was not created"
          }

      - name: Upload compiled AMX
        uses: actions/upload-artifact@v4
        with:
          name: pawn-${{ inputs.request_id }}
          path: output.amx
          if-no-files-found: error
          retention-days: 1
