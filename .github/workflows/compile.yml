name: Compile Pawn

on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Исходный код'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Установка компилятора
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
          tar -xzf pawnc-3.10.10-linux.tar.gz

      - name: Сохранение кода
        run: |
          cat << 'EOF' > script.pwn
          ${{ inputs.code }}
          EOF

      - name: Компиляция
        run: |
          ./pawnc-3.10.10-linux/bin/pawncc script.pwn -i./pawnc-3.10.10-linux/include -oscript.amx

      - name: Сохранение результата
        uses: actions/upload-artifact@v4
        with:
          name: compiled-amx
          path: script.amx
