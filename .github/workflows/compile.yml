name: Compile Pawn

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID запроса"
        required: true
        type: string
      source_dir:
        description: "Папка с исходниками"
        required: true
        type: string

jobs:
  compile:
    runs-on: ubuntu-22.04
    container:
      image: michaelace/pawncc:3.10.11-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile
        shell: bash
        run: |
          # 1. Ищем файл .pwn
          MAIN_PWN=$(find "${{ inputs.source_dir }}" -type f -name "*.pwn" | grep -v "[а-яА-Я]" | head -n 1)
          
          if [ -z "$MAIN_PWN" ]; then
            echo "::error::Файл .pwn не найден в папке ${{ inputs.source_dir }}"
            exit 1
          fi

          echo "Компилируем файл: $MAIN_PWN"

          # 2. Ищем папку include
          USER_INC_DIR=$(find "${{ inputs.source_dir }}" -type d -name "include" | grep -v "[а-яА-Я]" | head -n 1)
          
          if [ -z "$USER_INC_DIR" ]; then
            echo "::warning::Папка include не найдена, компилируем без дополнительных инклюдов."
            INC_FLAGS=""
          else
            echo "Используем инклюды из: $USER_INC_DIR"
            INC_FLAGS="-i$USER_INC_DIR"
          fi

          # 3. Запускаем компиляцию (БЕЗ || true, чтобы увидеть ошибку)
          pawncc "$MAIN_PWN" $INC_FLAGS -ooutput.amx

          # 4. Если дошли сюда, значит компиляция прошла успешно
          echo "Компиляция успешна!"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawn-${{ inputs.request_id }}
          path: output.amx
          if-no-files-found: error
          retention-days: 1
