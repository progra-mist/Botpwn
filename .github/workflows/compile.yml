name: Compile Pawn

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID запроса"
        required: true
        type: string
      source_dir:
        description: "Папка с исходниками"
        required: true
        type: string

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Visual C++ 2010
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/1/6/5/165255E7-1014-4D0A-B094-B6A430A6BFFC/vcredist_x86.exe" -OutFile "vcredist_x86.exe"
          Start-Process -FilePath ".\vcredist_x86.exe" -ArgumentList "/q", "/norestart" -Wait

      - name: Download Pawn Compiler
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-windows.zip" -OutFile "pawnc.zip"
          Expand-Archive -Path "pawnc.zip" -DestinationPath "pawnc"
          $pawnccPath = Get-ChildItem -Path "pawnc" -Filter "pawncc.exe" -Recurse | Select-Object -First 1
          $pawncDll = Get-ChildItem -Path "pawnc" -Filter "pawnc.dll" -Recurse | Select-Object -First 1
          Copy-Item $pawnccPath.FullName -Destination "pawncc.exe"
          Copy-Item $pawncDll.FullName -Destination "pawnc.dll"

      - name: Compile
        shell: pwsh
        run: |
          $mainPwn = Get-ChildItem -Path "${{ inputs.source_dir }}" -Filter "*.pwn" -Recurse | Where-Object { $_.FullName -notmatch '\\include\\' } | Select-Object -First 1
          if (-not $mainPwn) { Write-Error "Главный .pwn не найден"; exit 1 }
          Write-Host "=== КОМПИЛИРУЕМ: $($mainPwn.FullName) ==="
          
          # Ищем ТОЛЬКО папки include и pawno/include (не трогаем modules!)
          $incDirs = @()
          
          # Стандартная папка pawno/include
          $pawnoInclude = Get-ChildItem -Path "${{ inputs.source_dir }}" -Directory -Recurse | Where-Object { $_.FullName -match '\\pawno\\include$' } | Select-Object -First 1
          if ($pawnoInclude) { $incDirs += $pawnoInclude.FullName }
          
          # Если pawno/include нет, ищем просто папку include
          if (-not $incDirs) {
            $stdInclude = Get-ChildItem -Path "${{ inputs.source_dir }}" -Directory -Recurse | Where-Object { $_.Name -eq 'include' } | Select-Object -First 1
            if ($stdInclude) { $incDirs += $stdInclude.FullName }
          }
          
          if (-not $incDirs) {
            Write-Error "Папка include не найдена!"
            exit 1
          }
          
          $args = @("$($mainPwn.FullName)", "-ooutput.amx")
          foreach ($dir in $incDirs) {
            $args += "-i"
            $args += "$dir"
            Write-Host "Добавляем путь к инклюдам: $dir"
          }
          
          Write-Host "=== ЗАПУСК PAWNCC ==="
          $output = & ".\pawncc.exe" @args 2>&1
          
          Write-Host "=== ВЫВОД ==="
          Write-Host $output
          
          if (-not (Test-Path "output.amx")) {
            Write-Error "Файл output.amx не создан."
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawn-${{ inputs.request_id }}
          path: output.amx
          if-no-files-found: error
          retention-days: 1
