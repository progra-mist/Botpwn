name: Compile Pawn

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID запроса"
        required: true
        type: string
      source_dir:
        description: "Папка с исходниками"
        required: true
        type: string

jobs:
  compile:
    runs-on: ubuntu-22.04
    container:
      image: michaelace/pawncc:3.10.11-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile
        shell: bash
        run: |
          # 1. Ищем главный .pwn СТРОГО в папке gamemodes
          MAIN_PWN=$(find "${{ inputs.source_dir }}" -type f -path "*/gamemodes/*.pwn" | head -n 1)
          
          # Если вдруг папки gamemodes нет, ищем любой .pwn, но НЕ в include
          if [ -z "$MAIN_PWN" ]; then
            echo "::warning::Папка gamemodes не найдена, ищем любой .pwn вне include..."
            MAIN_PWN=$(find "${{ inputs.source_dir }}" -type f -name "*.pwn" -not -path "*/include/*" | head -n 1)
          fi
          
          if [ -z "$MAIN_PWN" ]; then
            echo "::error::Главный файл .pwn не найден"
            exit 1
          fi

          echo "=== КОМПИЛИРУЕМ: $MAIN_PWN ==="

          # 2. Ищем папку include (сначала стандартную pawno/include)
          USER_INC_DIR=$(find "${{ inputs.source_dir }}" -type d -path "*/pawno/include" | head -n 1)
          
          # Если такой нет, ищем просто любую папку include
          if [ -z "$USER_INC_DIR" ]; then
            USER_INC_DIR=$(find "${{ inputs.source_dir }}" -type d -name "include" | head -n 1)
          fi
          
          if [ -z "$USER_INC_DIR" ]; then
            echo "::error::Папка include не найдена."
            exit 1
          fi

          echo "=== ИСПОЛЬЗУЕМ ИНКЛЮДЫ: $USER_INC_DIR ==="

          # 3. Запускаем компиляцию
          pawncc "$MAIN_PWN" "-i$USER_INC_DIR" -ooutput.amx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawn-${{ inputs.request_id }}
          path: output.amx
          if-no-files-found: error
          retention-days: 1
