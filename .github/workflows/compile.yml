name: Compile Pawn

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID запроса"
        required: true
        type: string
      source_dir:
        description: "Папка с исходниками"
        required: true
        type: string

jobs:
  compile:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and Extract Compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $compilerZip = Join-Path $root 'pawnc.zip'
          
          if (-not (Test-Path -LiteralPath $compilerZip)) {
            $url = "https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-windows.zip"
            Invoke-WebRequest -Uri $url -OutFile $compilerZip
          }
          
          $extractDir = Join-Path $root 'pawnc_temp'
          if (-not (Test-Path -LiteralPath $extractDir)) {
            Expand-Archive -Path $compilerZip -DestinationPath $extractDir -Force
          }
          
          Write-Host "Компилятор распакован в: $extractDir"

      - name: Compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $root = $env:GITHUB_WORKSPACE
          $sourceDir = Join-Path $root '${{ inputs.source_dir }}'
          
          if (-not (Test-Path -LiteralPath $sourceDir)) {
            throw "Не найдена папка с исходниками: $sourceDir"
          }
          
          # Ищем главный .pwn (в gamemodes)
          $sources = @(Get-ChildItem -LiteralPath $sourceDir -Filter '*.pwn' -File -Recurse | Where-Object { $_.FullName -match '[\\/]+gamemodes[\\/]' })
          if ($sources.Count -eq 0) {
            throw "Не найден .pwn-файл внутри gamemodes в '$sourceDir'"
          }
          
          $source = $sources[0].FullName
          Write-Host "Исходник: $source"
          
          # Ищем pawncc.exe во всех папках
          $searchRoots = @($root, $env:RUNNER_TEMP) | Where-Object { Test-Path -LiteralPath $_ }
          $matches = @(
            foreach ($dir in $searchRoots) {
              Get-ChildItem -LiteralPath $dir -Filter 'pawncc.exe' -File -Recurse -ErrorAction SilentlyContinue
            }
          ) | Sort-Object FullName -Unique
          
          if ($matches.Count -eq 0) {
            throw "pawncc.exe не найден."
          }
          
          $pawncc = $matches[0].FullName
          $pawnccDir = $matches[0].DirectoryName
          Write-Host "Компилятор: $pawncc"
          
          # Собираем все папки, где есть .inc файлы
          $includeDirs = @(
            $sourceDir
            (Join-Path $sourceDir 'pawno/include')
            (Join-Path $sourceDir 'include')
            (Join-Path $sourceDir 'includes')
          )

          $incFiles = Get-ChildItem -LiteralPath $sourceDir -Filter '*.inc' -File -Recurse |
            Where-Object {
              $_.FullName -notmatch '[\\/](\.git|node_modules|bin|obj)[\\/]'
            }

          $includeDirs += $incFiles | ForEach-Object { $_.DirectoryName }

          # Оставляем только существующие уникальные пути
          $includeDirs = @(
            $includeDirs |
              Where-Object { $_ -and (Test-Path -LiteralPath $_) } |
              ForEach-Object { (Resolve-Path -LiteralPath $_).Path } |
              Sort-Object -Unique
          )

          if ($includeDirs.Count -eq 0) {
            throw "Не найдено ни одной папки с инклюдами."
          }

          Write-Host "Найдено папок с инклюдами: $($includeDirs.Count)"
          
          $output = Join-Path $root 'Crime.amx'
          $args = @($source)
          foreach ($dir in $includeDirs) {
            $args += "-i$dir"
          }
          $args += "-o$output"

          Push-Location $pawnccDir
          try {
            & $pawncc @args
            $code = $LASTEXITCODE
          }
          finally {
            Pop-Location
          }

          if ($code -ne 0) {
            throw "Компилятор завершился с кодом $code."
          }

          if (-not (Test-Path -LiteralPath $output)) {
            throw "Компилятор не создал файл $output"
          }

          Write-Host "Готово: $output"

      - name: Upload Crime.amx
        uses: actions/upload-artifact@v4
        with:
          name: Crime-amx
          path: Crime.amx
          if-no-files-found: error
          retention-days: 1
