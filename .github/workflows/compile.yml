name: Compile Pawn (Windows)
run-name: Compile Pawn [${{ inputs.request_id }}]

on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      source_dir:
        required: true
        type: string

jobs:
  compile-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install VC++ runtimes
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = `
              [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            Invoke-Expression `
              ((New-Object System.Net.WebClient).DownloadString(
                "https://community.chocolatey.org/install.ps1"
              ))
          }

          choco install vcredist2010 vcredist2015 -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Не удалось установить VC++ Redistributable через Chocolatey."
          }

      - name: Download and set up Pawn compiler
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-windows.zip"
          $root = "C:\pawnc"
          $stage = Join-Path $env:RUNNER_TEMP "pawnc-extracted"
          $zip = Join-Path $env:RUNNER_TEMP "pawnc.zip"
          $bin = Join-Path $root "bin"
          $standardInclude = Join-Path $root "include"

          Remove-Item $root, $stage, $zip -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $root, $stage, $bin | Out-Null

          Invoke-WebRequest -Uri $url -OutFile $zip
          if (-not (Test-Path -LiteralPath $zip) -or
              (Get-Item -LiteralPath $zip).Length -eq 0) {
            throw "Архив Pawn не скачался или пуст."
          }

          Expand-Archive -LiteralPath $zip -DestinationPath $stage -Force

          $compiler = Get-ChildItem -LiteralPath $stage `
            -Filter "pawncc.exe" -File -Recurse |
            Select-Object -First 1

          if (-not $compiler) {
            throw "В архиве не найден pawncc.exe."
          }

          # Кладём содержимое каталога компилятора непосредственно в C:\pawnc\bin.
          Get-ChildItem -LiteralPath $compiler.DirectoryName -Force |
            Copy-Item -Destination $bin -Recurse -Force

          # Некоторые сборки содержат pawnc.dll не рядом с pawncc.exe.
          $dll = Get-ChildItem -LiteralPath $stage `
            -Filter "pawnc.dll" -File -Recurse |
            Select-Object -First 1

          if ($dll -and
              -not (Test-Path -LiteralPath (Join-Path $bin "pawnc.dll"))) {
            Copy-Item -LiteralPath $dll.FullName `
              -Destination (Join-Path $bin "pawnc.dll") -Force
          }

          $pawnccInBin = Join-Path $bin "pawncc.exe"
          if (-not (Test-Path -LiteralPath $pawnccInBin)) {
            throw "Не удалось скопировать pawncc.exe в $bin."
          }

          if (-not (Test-Path -LiteralPath (Join-Path $bin "pawnc.dll"))) {
            throw "pawnc.dll не найден рядом с pawncc.exe и в архиве."
          }

          # Ищем include в распакованном архиве и приводим его к стандартному пути.
          $packageInclude = Get-ChildItem -LiteralPath $stage `
            -Directory -Recurse |
            Where-Object { $_.Name -ieq "include" } |
            Sort-Object { $_.FullName.Length } |
            Select-Object -First 1

          if ($packageInclude) {
            Copy-Item -LiteralPath $packageInclude.FullName `
              -Destination $standardInclude -Recurse -Force
          }
          else {
            # Запасной вариант: include в корне checkout-репозитория.
            $repoInclude = Join-Path $env:GITHUB_WORKSPACE "include"
            if (Test-Path -LiteralPath $repoInclude -PathType Container) {
              Copy-Item -LiteralPath $repoInclude `
                -Destination $standardInclude -Recurse -Force
            }
          }

          if (-not (Test-Path -LiteralPath $standardInclude -PathType Container)) {
            throw "Папка include не найдена ни в архиве компилятора, ни в репозитории."
          }

          Write-Host "pawncc: $pawnccInBin"
          Write-Host "pawnc.dll: $(Join-Path $bin 'pawnc.dll')"
          Write-Host "include: $standardInclude"

      - name: Find source and compile
        shell: powershell
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          SOURCE_DIR: ${{ inputs.source_dir }}
        run: |
          $ErrorActionPreference = "Stop"

          $workspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $sourcePath = [System.IO.Path]::GetFullPath(
            (Join-Path $workspace $env:SOURCE_DIR)
          )
          $workspacePrefix = $workspace.TrimEnd('\') + '\'

          if (-not $sourcePath.StartsWith(
            $workspacePrefix,
            [System.StringComparison]::OrdinalIgnoreCase
          )) {
            throw "source_dir должен находиться внутри workspace."
          }

          if (-not (Test-Path -LiteralPath $sourcePath -PathType Container)) {
            throw "Папка исходников не найдена: $sourcePath"
          }

          # Исключаем .pwn-файлы, лежащие в папках include.
          $pwnFiles = @(
            Get-ChildItem -LiteralPath $sourcePath -Filter "*.pwn" `
              -File -Recurse |
              Where-Object {
                $_.FullName -notmatch '[\\/]+include[\\/]+'
              } |
              Sort-Object FullName
          )

          if ($pwnFiles.Count -eq 0) {
            throw "В $sourcePath не найден главный .pwn-файл вне папок include."
          }

          if ($pwnFiles.Count -gt 1) {
            Write-Warning "Найдено несколько .pwn-файлов; выбран первый: $($pwnFiles[0].FullName)"
            $pwnFiles | ForEach-Object { Write-Host "Кандидат: $($_.FullName)" }
          }

          $mainPwn = $pwnFiles[0].FullName
          $pawncc = "C:\pawnc\bin\pawncc.exe"
          $standardInclude = "C:\pawnc\include"
          $amxPath = Join-Path $workspace "Crime.amx"
          $amxBase = [System.IO.Path]::Combine($workspace, "Crime")

          # Если в папке исходников есть свой include, добавляем и его.
          $sourceIncludes = @(
            Get-ChildItem -LiteralPath $sourcePath -Directory -Recurse |
              Where-Object { $_.Name -ieq "include" } |
              Sort-Object { $_.FullName.Length } |
              Select-Object -ExpandProperty FullName
          )

          $includeArgs = @()
          foreach ($includeDir in $sourceIncludes) {
            $includeArgs += "-i$includeDir"
          }

          if (-not ($sourceIncludes -contains $standardInclude)) {
            $includeArgs += "-i$standardInclude"
          }

          Write-Host "Компилируется: $mainPwn"
          Write-Host "Выходной файл: $amxPath"
          Write-Host "Include-пути: $($includeArgs -join '; ')"

          # Вызов по полному пути: текущая папка не имеет значения.
          & $pawncc $mainPwn "-o$amxBase" @includeArgs "-d3"

          if ($LASTEXITCODE -ne 0) {
            throw "pawncc завершился с кодом $LASTEXITCODE."
          }

          if (-not (Test-Path -LiteralPath $amxPath -PathType Leaf)) {
            throw "Компилятор завершился без ошибки, но Crime.amx не создан."
          }

          Write-Host "Успешно создан: $amxPath"

      - name: Upload Crime.amx
        uses: actions/upload-artifact@v4
        with:
          name: pawn-${{ inputs.request_id }}
          path: Crime.amx
          if-no-files-found: error
          retention-days: 1
