name: Compile Pawn

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID запроса"
        required: true
        type: string
      source_dir:
        description: "Папка с исходниками"
        required: true
        type: string

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile
        shell: pwsh
        run: |
          # Компилятор уже лежит в репозитории (мы загрузили его вручную)
          $pawnccPath = ".\pawncc.exe"
          
          if (-not (Test-Path $pawnccPath)) {
            Write-Error "pawncc.exe не найден в корне репозитория!"
            exit 1
          }
          
          $mainPwn = Get-ChildItem -Path "${{ inputs.source_dir }}" -Filter "*.pwn" -Recurse | Where-Object { $_.FullName -notmatch '\\include\\' } | Select-Object -First 1
          if (-not $mainPwn) {
            Write-Error "Главный файл .pwn не найден"
            exit 1
          }
          Write-Host "=== КОМПИЛИРУЕМ: $($mainPwn.FullName) ==="
          
          $allDirs = Get-ChildItem -Path "${{ inputs.source_dir }}" -Directory -Recurse | Select-Object -ExpandProperty FullName
          $incFlags = ""
          foreach ($dir in $allDirs) {
            $incFlags += " -i`"$dir`""
          }
          
          Write-Host "=== ЗАПУСК PAWNCC ==="
          $output = & $pawnccPath $mainPwn.FullName $incFlags -ooutput.amx 2>&1
          
          Write-Host "=== ВЫВОД ==="
          Write-Host $output
          
          if (-not (Test-Path "output.amx")) {
            Write-Error "Файл output.amx не создан."
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawn-${{ inputs.request_id }}
          path: output.amx
          if-no-files-found: error
          retention-days: 1
