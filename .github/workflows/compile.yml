name: Compile Pawn

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID запроса"
        required: true
        type: string
      source_dir:
        description: "Папка с исходниками"
        required: true
        type: string

jobs:
  compile:
    runs-on: ubuntu-22.04
    container:
      image: michaelace/pawncc:3.10.11-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile
        shell: bash
        run: |
          # 1. Ищем файл .pwn
          MAIN_PWN=$(find "${{ inputs.source_dir }}" -type f -name "*.pwn" | head -n 1)
          
          if [ -z "$MAIN_PWN" ]; then
            echo "::error::Файл .pwn не найден"
            exit 1
          fi

          echo "=== КОМПИЛИРУЕМ: $MAIN_PWN ==="

          # 2. Ищем папку include
          USER_INC_DIR=$(find "${{ inputs.source_dir }}" -type d -name "include" | head -n 1)
          
          if [ -z "$USER_INC_DIR" ]; then
            echo "=== ВНИМАНИЕ: папка include не найдена ==="
            INC_FLAGS=""
          else
            echo "=== ИСПОЛЬЗУЕМ ИНКЛЮДЫ: $USER_INC_DIR ==="
            INC_FLAGS="-i$USER_INC_DIR"
          fi

          # 3. Запускаем компиляцию и ЛОВИМ весь вывод
          echo "=== НАЧАЛО ВЫВОДА PAWNCC ==="
          pawncc "$MAIN_PWN" $INC_FLAGS -ooutput.amx 2>&1 | tee compile_log.txt
          echo "=== КОНЕЦ ВЫВОДА PAWNCC ==="

          # 4. Проверяем, создался ли файл
          if [ ! -s output.amx ]; then
            echo "::error::Файл output.amx не создан. Ошибка компиляции."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawn-${{ inputs.request_id }}
          path: output.amx
          if-no-files-found: error
          retention-days: 1
