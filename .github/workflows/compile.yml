name: Compile Pawn

on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Исходный код'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container: sacnr/pawncc
    steps:
      - name: Сохранение кода
        run: |
          cat << 'EOF' > script.pwn
          ${{ inputs.code }}
          EOF

      - name: Поиск компилятора и запуск
        run: |
          echo "=== ИЩЕМ КОМПИЛЯТОР ==="
          find / -name "pawncc" 2>/dev/null || echo "Компилятор не найден"
          
          echo "=== ИЩЕМ БИБЛИОТЕКИ ==="
          find / -name "libpawnc*" 2>/dev/null || echo "Библиотеки не найдены"
          
          echo "=== ПРОБУЕМ ЗАПУСТИТЬ ЧЕРЕЗ ИМЯ ==="
          pawncc script.pwn -oscript.amx && echo "УСПЕХ!" || echo "ОШИБКА ЗАПУСКА"

      - name: Сохранение результата
        uses: actions/upload-artifact@v4
        with:
          name: compiled-amx
          path: script.amx
          if-no-files-found: ignore
