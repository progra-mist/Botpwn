name: Compile Pawn (Windows)

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID запроса"
        required: true
        type: string
      source_dir:
        description: "Папка с исходниками"
        required: true
        type: string

jobs:
  compile-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install VC++ 2010 (x86)
        shell: powershell
        run: |
          $url = "https://download.microsoft.com/download/1/6/5/165255E7-1014-4D0A-B094-B6A430A6BFFC/vcredist_x86.exe"
          Invoke-WebRequest -Uri $url -OutFile "vcredist_x86.exe"
          Start-Process -FilePath ".\vcredist_x86.exe" -ArgumentList "/q", "/norestart" -Wait
          Remove-Item ".\vcredist_x86.exe"

      - name: Download Pawn Compiler (3.10.10)
        shell: powershell
        run: |
          $url = "https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-windows.zip"
          Invoke-WebRequest -Uri $url -OutFile "pawnc.zip"
          Expand-Archive -Path "pawnc.zip" -DestinationPath "C:\pawnc"
          Remove-Item "pawnc.zip"

      - name: Compile Gamemode
        shell: cmd
        run: |
          cd /D "C:\pawnc\bin"
          
          set MAIN_PWN=
          for /f "delims=" %%i in ('dir /b /s "${{ inputs.source_dir }}\*.pwn" ^| findstr /v /i "\\include\\"') do (
            set MAIN_PWN=%%i
            goto :found
          )
          :found
          if "%MAIN_PWN%"=="" (
            echo Главный .pwn не найден
            exit /b 1
          )
          
          for %%F in ("%MAIN_PWN%") do set MODNAME=%%~nF
          
          echo === КОМПИЛИРУЕМ: %MAIN_PWN% ===
          echo === ИМЯ МОДА: %MODNAME% ===
          
          set INC_DIR=
          for /f "delims=" %%d in ('dir /b /s /ad "${{ inputs.source_dir }}" ^| findstr /i "\\include$"') do (
            set INC_DIR=%%d
            goto :found_inc
          )
          :found_inc
          if "%INC_DIR%"=="" (
            echo Папка include не найдена
            exit /b 1
          )
          
          echo === ИНКЛЮДЫ: %INC_DIR% ===
          
          :: Компилируем (файл создастся в C:\pawnc\bin\%MODNAME%.amx)
          pawncc.exe "%MAIN_PWN%" ^
            "-o%MODNAME%" ^
            "-i%INC_DIR%" ^
            "-iC:\pawnc\include" ^
            -d3 -;+ -(
            
          if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%
          
          :: Копируем результат в папку репозитория, где GitHub его найдет
          copy "C:\pawnc\bin\%MODNAME%.amx" "%GITHUB_WORKSPACE%\%MODNAME%.amx"
          
          if not exist "%GITHUB_WORKSPACE%\%MODNAME%.amx" (
            echo Файл %MODNAME%.amx не создан!
            exit /b 1
          )

      - name: Upload AMX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawn-${{ inputs.request_id }}
          path: ${{ github.workspace }}/*.amx
          if-no-files-found: error
          retention-days: 1
