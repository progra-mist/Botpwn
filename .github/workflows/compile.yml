name: Compile Pawn

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID запроса бота"
        required: true
        type: string
      code:
        description: "Исходный код"
        required: true
        type: string

jobs:
  compile:
    runs-on: ubuntu-22.04
    container:
      image: michaelace/pawncc:3.10.11-linux
    steps:
      - name: Prepare source
        shell: bash
        run: |
          mkdir -p output
          cat << 'EOF' > script.pwn
          ${{ inputs.code }}
          EOF

      - name: Compile
        shell: bash
        run: |
          # В этом образе pawncc уже доступен как команда
          pawncc script.pwn -oscript.amx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawn-${{ inputs.request_id }}
          path: script.amx
          if-no-files-found: error
          retention-days: 1      
