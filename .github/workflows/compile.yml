name: Compile Pawn

on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Исходный код'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание и распаковка
        run: |
          wget https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
          tar -xzf pawnc-3.10.10-linux.tar.gz
          echo "--- Содержимое папки: ---"
          ls -la
          echo "--- Ищем pawncc: ---"
          find . -name "pawncc"

      - name: Сохранение кода
        run: |
          cat << 'EOF' > script.pwn
          ${{ inputs.code }}
          EOF

      - name: Компиляция
        run: |
          # Ищем файл pawncc и даем ему права на запуск
          find . -name "pawncc" -exec chmod +x {} \;
          # Запускаем компилятор с указанием пути к библиотекам
          export LD_LIBRARY_PATH=$(dirname $(find . -name "libpawnc.so" | head -n 1)):$LD_LIBRARY_PATH
          $(find . -name "pawncc" | head -n 1) script.pwn -i$(dirname $(find . -name "pawncc" | head -n 1))/../include -oscript.amx

      - name: Сохранение результата
        uses: actions/upload-artifact@v4
        with:
          name: compiled-amx
          path: script.amx
