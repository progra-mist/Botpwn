name: Compile Pawn (Windows)

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID запроса"
        required: true
        type: string
      source_dir:
        description: "Папка с исходниками"
        required: true
        type: string

jobs:
  compile-windows:
    # 📌 windows-2022 содержит полную 32-битную подсистему без урезаний Server 2025
    runs-on: windows-2022

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Install Full Visual C++ Runtimes (x86 & x64)
        shell: powershell
        run: |
          choco install vcredist-all --no-progress -y

      - name: 📦 Download Pawn Compiler (3.10.10)
        shell: powershell
        run: |
          $url = "https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-windows.zip"
          Invoke-WebRequest -Uri $url -OutFile "pawnc.zip"
          Expand-Archive -Path "pawnc.zip" -DestinationPath "C:\pawnc"
          Remove-Item "pawnc.zip"

      - name: 🔨 Compile Gamemode
        shell: cmd
        run: |
          cd /D "C:\pawnc\bin"
          
          :: Ищем главный .pwn в динамической папке
          set MAIN_PWN=
          for /f "delims=" %%i in ('dir /b /s "${{ inputs.source_dir }}\*.pwn" ^| findstr /v /i "\\include\\"') do (
            set MAIN_PWN=%%i
            goto :found
          )
          :found
          if "%MAIN_PWN%"=="" (
            echo Главный .pwn не найден
            exit /b 1
          )
          
          echo === КОМПИЛИРУЕМ: %MAIN_PWN% ===
          
          :: Ищем папку include
          set INC_DIR=
          for /f "delims=" %%d in ('dir /b /s /ad "${{ inputs.source_dir }}" ^| findstr /i "\\include$"') do (
            set INC_DIR=%%d
            goto :found_inc
          )
          :found_inc
          if "%INC_DIR%"=="" (
            echo Папка include не найдена
            exit /b 1
          )
          
          echo === ИНКЛЮДЫ: %INC_DIR% ===
          
          pawncc.exe "%MAIN_PWN%" ^
            "-o%GITHUB_WORKSPACE%\output.amx" ^
            "-i%INC_DIR%" ^
            "-iC:\pawnc\include" ^
            -d3 -;+ -(
            
          if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%

      - name: 📤 Upload AMX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawn-${{ inputs.request_id }}
          path: output.amx
          if-no-files-found: error
          retention-days: 1
