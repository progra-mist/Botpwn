name: Compile Pawn

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID запроса"
        required: true
        type: string
      source_dir:
        description: "Папка с исходниками"
        required: true
        type: string

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Visual C++ 2010 Redistributable
        shell: pwsh
        run: |
          # Скачиваем и устанавливаем Visual C++ 2010 Redistributable (x86)
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/1/6/5/165255E7-1014-4D0A-B094-B6A430A6BFFC/vcredist_x86.exe" -OutFile "vcredist_x86.exe"
          Start-Process -FilePath ".\vcredist_x86.exe" -ArgumentList "/q", "/norestart" -Wait
          Write-Host "Visual C++ 2010 установлен."

      - name: Download Pawn Compiler
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-windows.zip" -OutFile "pawnc.zip"
          Expand-Archive -Path "pawnc.zip" -DestinationPath "pawnc"
          
          $pawnccPath = Get-ChildItem -Path "pawnc" -Filter "pawncc.exe" -Recurse | Select-Object -First 1
          $pawncDll = Get-ChildItem -Path "pawnc" -Filter "pawnc.dll" -Recurse | Select-Object -First 1
          
          if (-not $pawnccPath) { Write-Error "pawncc.exe не найден"; exit 1 }
          if (-not $pawncDll) { Write-Error "pawnc.dll не найден"; exit 1 }
          
          Copy-Item $pawnccPath.FullName -Destination "pawncc.exe"
          Copy-Item $pawncDll.FullName -Destination "pawnc.dll"
          
          Write-Host "Компилятор и DLL скопированы в корень."

      - name: Compile
        shell: pwsh
        run: |
          $mainPwn = Get-ChildItem -Path "${{ inputs.source_dir }}" -Filter "*.pwn" -Recurse | Where-Object { $_.FullName -notmatch '\\include\\' } | Select-Object -First 1
          if (-not $mainPwn) {
            Write-Error "Главный файл .pwn не найден"
            exit 1
          }
          Write-Host "=== КОМПИЛИРУЕМ: $($mainPwn.FullName) ==="
          
          $allDirs = Get-ChildItem -Path "${{ inputs.source_dir }}" -Directory -Recurse | Select-Object -ExpandProperty FullName
          $incFlags = ""
          foreach ($dir in $allDirs) {
            $incFlags += " -i`"$dir`""
          }
          
          Write-Host "=== ЗАПУСК PAWNCC ==="
          # Запускаем и перенаправляем ВСЁ в файл, чтобы поймать даже самые скрытые ошибки
          & ".\pawncc.exe" $mainPwn.FullName $incFlags -ooutput.amx *> compiler_output.txt
          
          Write-Host "=== ВЫВОД КОМПИЛЯТОРА ==="
          if (Test-Path "compiler_output.txt") {
            Get-Content "compiler_output.txt" | Write-Host
          } else {
            Write-Host "Файл вывода не создан (компилятор упал мгновенно)."
          }
          
          if (-not (Test-Path "output.amx")) {
            Write-Error "Файл output.amx не создан."
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawn-${{ inputs.request_id }}
          path: output.amx
          if-no-files-found: error
          retention-days: 1
