name: Compile Pawn

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID запроса"
        required: true
        type: string
      source_dir:
        description: "Папка с исходниками"
        required: true
        type: string

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Visual C++ 2010
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/1/6/5/165255E7-1014-4D0A-B094-B6A430A6BFFC/vcredist_x86.exe" -OutFile "vcredist_x86.exe"
          Start-Process -FilePath ".\vcredist_x86.exe" -ArgumentList "/q", "/norestart" -Wait

      - name: Download Pawn Compiler
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-windows.zip" -OutFile "pawnc.zip"
          Expand-Archive -Path "pawnc.zip" -DestinationPath "pawnc"
          $pawnccPath = Get-ChildItem -Path "pawnc" -Filter "pawncc.exe" -Recurse | Select-Object -First 1
          $pawncDll = Get-ChildItem -Path "pawnc" -Filter "pawnc.dll" -Recurse | Select-Object -First 1
          Copy-Item $pawnccPath.FullName -Destination "pawncc.exe"
          Copy-Item $pawncDll.FullName -Destination "pawnc.dll"

      - name: Compile in Short Path
        shell: pwsh
        run: |
          # 1. Создаем короткую папку C:\work
          New-Item -Path "C:\work" -ItemType Directory -Force
          
          # 2. Копируем туда компилятор
          Copy-Item "pawncc.exe" -Destination "C:\work\pawncc.exe"
          Copy-Item "pawnc.dll" -Destination "C:\work\pawnc.dll"
          
          # 3. Ищем главный .pwn и папку include
          $mainPwn = Get-ChildItem -Path "${{ inputs.source_dir }}" -Filter "*.pwn" -Recurse | Where-Object { $_.FullName -notmatch '\\include\\' } | Select-Object -First 1
          if (-not $mainPwn) { Write-Error "Главный .pwn не найден"; exit 1 }
          
          $incDir = Get-ChildItem -Path "${{ inputs.source_dir }}" -Directory -Recurse | Where-Object { $_.FullName -match '\\pawno\\include$' } | Select-Object -First 1
          if (-not $incDir) {
             $incDir = Get-ChildItem -Path "${{ inputs.source_dir }}" -Directory -Recurse | Where-Object { $_.Name -eq 'include' } | Select-Object -First 1
          }
          
          if (-not $incDir) { Write-Error "Папка include не найдена"; exit 1 }
          
          # 4. Копируем главный файл и инклюды в C:\work
          # (чтобы компилятор видел их в одной папке)
          Copy-Item $mainPwn.FullName -Destination "C:\work\main.pwn"
          
          # Копируем папку include целиком
          Copy-Item -Path $incDir.FullName -Destination "C:\work\include" -Recurse -Force
          
          # 5. Запускаем компилятор в короткой папке
          Set-Location "C:\work"
          Write-Host "=== ЗАПУСК В КОРОТКОЙ ПАПКЕ ==="
          
          # Запускаем с относительными путями
          $output = & ".\pawncc.exe" "main.pwn" "-iinclude" -ooutput.amx 2>&1
          
          Write-Host "=== ВЫВОД ==="
          Write-Host $output
          
          # 6. Копируем результат обратно в репозиторий
          if (Test-Path "C:\work\output.amx") {
            Copy-Item "C:\work\output.amx" -Destination "output.amx"
            Write-Host "Успех! Файл output.amx скопирован."
          } else {
            Write-Error "Файл output.amx не создан."
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawn-${{ inputs.request_id }}
          path: output.amx
          if-no-files-found: error
          retention-days: 1
