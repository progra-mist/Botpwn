name: Compile Pawn

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID запроса"
        required: true
        type: string
      source_dir:
        description: "Папка с исходниками"
        required: true
        type: string

jobs:
  compile:
    runs-on: ubuntu-22.04
    container:
      image: michaelace/pawncc:3.10.11-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile
        shell: bash
        run: |
          echo "=== Сканируем архив на наличие файлов ==="
          
          # 1. Ищем ВСЕ файлы .pwn, КРОМЕ тех, что лежат в папках include
          MAIN_PWN=$(find "${{ inputs.source_dir }}" -type f -name "*.pwn" -not -path "*/include/*" | head -n 1)
          
          if [ -z "$MAIN_PWN" ]; then
            echo "::error::Главный файл .pwn не найден (исключены папки include)."
            exit 1
          fi

          echo "=== КОМПИЛИРУЕМ: $MAIN_PWN ==="

          # 2. Собираем АБСОЛЮТНО ВСЕ папки в архиве пользователя
          INC_DIRS=$(find "${{ inputs.source_dir }}" -type d)
          
          # Формируем флаги -i для каждой найденной папки
          INC_FLAGS=""
          for dir in $INC_DIRS; do
            INC_FLAGS="$INC_FLAGS -i$dir"
          done

          echo "=== ДОБАВЛЕНО ПУТЕЙ ДЛЯ ПОИСКА: $(echo $INC_DIRS | wc -w) ==="

          # 3. Запускаем компиляцию
          pawncc "$MAIN_PWN" $INC_FLAGS -ooutput.amx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawn-${{ inputs.request_id }}
          path: output.amx
          if-no-files-found: error
          retention-days: 1
