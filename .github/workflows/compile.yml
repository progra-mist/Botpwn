name: Compile Pawn

on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Исходный код'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание компилятора
        run: |
          wget https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
          tar -xzf pawnc-3.10.10-linux.tar.gz

      - name: Сохранение кода
        run: |
          cat << 'EOF' > script.pwn
          ${{ inputs.code }}
          EOF

      - name: Компиляция
        run: |
          # Делаем файл pawncc исполняемым
          chmod +x pawnc-3.10.10-linux/bin/pawncc
          # Указываем, где лежит библиотека libpawnc.so
          export LD_LIBRARY_PATH=./pawnc-3.10.10-linux/lib:$LD_LIBRARY_PATH
          # Запускаем
          ./pawnc-3.10.10-linux/bin/pawncc script.pwn -oscript.amx

      - name: Сохранение результата
        uses: actions/upload-artifact@v4
        with:
          name: compiled-amx
          path: script.amx
