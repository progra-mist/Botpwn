name: Compile Pawn

on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Исходный код'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: michaelace/pawncc:3.10.11-linux
    steps:
      - name: Сохранение кода
        run: |
          cat << 'EOF' > script.pwn
          ${{ inputs.code }}
          EOF

      - name: Компиляция
        run: |
          pawncc script.pwn -oscript.amx

      - name: Сохранение результата
        uses: actions/upload-artifact@v4
        with:
          name: compiled-amx
          path: script.amx
